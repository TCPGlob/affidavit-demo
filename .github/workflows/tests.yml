name: tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is included deliberately: the team runs Word on Windows, and
        # path handling is the most likely thing to break there.
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pymupdf pillow openpyxl

      - name: Install LibreOffice and Tesseract (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libreoffice-writer libreoffice-calc tesseract-ocr

      - name: Install LibreOffice and Tesseract (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install --no-progress -y tesseract
          # LibreOffice is a large install; it is optional, and the pipeline is
          # asserted to degrade gracefully without it, so it is skipped here.

      - name: Create the sample intake
        run: python pipeline.py demo

      - name: Run the pipeline
        run: python pipeline.py run --fresh

      - name: Folder watcher tests
        run: python watcher_test.py

      - name: Collection workflow tests
        run: python collections_test.py

      - name: OCR tests
        run: python ocr_test.py

      - name: Account management tests
        run: python users_test.py

      - name: Console tests
        run: python smoke_test.py

      - name: Console script checks
        run: python console_test.py

      - name: Authentication and multi-user tests
        run: python auth_test.py

      - name: Password recovery tests
        run: python recovery_test.py

      - name: Folder browser tests
        run: python browse_test.py

      - name: Clearing the library tests
        run: python clear_test.py

      - name: Legacy affidavit export tests
        run: python e2e_test.py

      - name: Build a bundle end to end
        run: python pipeline.py bundle --docs 1,2,3 --name "CI Bundle" --user ci

      - name: Verify no client material would be committed
        shell: bash
        run: |
          # intake/, work/ and output/ must all be ignored.
          for p in intake/x.pdf work/x.sqlite3 output/x.pdf affidavit.config.json; do
            if git check-ignore -q "$p"; then
              echo "OK   ignored: $p"
            else
              echo "FAIL not ignored: $p"
              exit 1
            fi
          done
