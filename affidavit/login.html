<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in &mdash; Affidavit Review Console</title>
<style>
  :root{--ink:#101828;--mut:#667085;--line:#e4e7eb;--danger:#b42318}
  *{box-sizing:border-box}
  body{font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       margin:0;color:var(--ink);background:#f8f9fb;display:flex;align-items:center;
       justify-content:center;min-height:100vh;padding:20px}
  .box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:30px 32px;
       width:100%;max-width:400px;box-shadow:0 6px 24px rgba(16,24,40,.07)}
  h1{font-size:17px;margin:0 0 4px}
  .sub{color:var(--mut);font-size:12.5px;margin-bottom:22px}
  label{display:block;font-size:12.5px;font-weight:600;margin:14px 0 5px}
  input{width:100%;padding:10px 11px;border:1px solid #d0d5dd;border-radius:7px;font:inherit}
  input:focus{outline:2px solid #84caff;outline-offset:-1px}
  button{width:100%;margin-top:20px;background:var(--ink);color:#fff;border:0;border-radius:7px;
         padding:11px;font:inherit;font-weight:600;cursor:pointer}
  button:hover{opacity:.92}
  .err{background:#fef3f2;border:1px solid #fecdca;color:var(--danger);padding:9px 12px;
       border-radius:7px;font-size:12.5px;margin-bottom:16px}
  .note{margin-top:20px;padding-top:16px;border-top:1px solid var(--line);color:var(--mut);
        font-size:11.5px}
  .forgot{display:block;text-align:center;margin-top:14px;font-size:12.5px;color:#175cd3;
          text-decoration:none}
  .forgot:hover{text-decoration:underline}
</style>
</head>
<body>
<form class="box" method="POST" action="/login" autocomplete="on">
  <h1>Affidavit Review Console</h1>
  <div class="sub">Sign in to record your review decisions.</div>
  __ERROR__
  <label for="username">Username</label>
  <input id="username" name="username" autocomplete="username" autofocus required>
  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required>
  <button type="submit">Sign in</button>
  <a class="forgot" href="/recover">Forgotten your password?</a>
  <div class="note">
    Every decision you make is recorded against your name. Documents you assign are
    attributed to you in the affidavit's audit trail, so use your own account.
  </div>
</form>
</body>
</html>
